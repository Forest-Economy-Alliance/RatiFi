buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Google Services plugin for Firebase (processes google-services.json)
        classpath("com.google.gms:google-services:4.3.15")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Force AndroidX artifacts to prevent duplicate classes from old support libs
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support') {
                // Redirect old support libs to AndroidX equivalents when possible
                if (details.requested.name.startsWith('support-')) {
                    details.useTarget "androidx.${details.requested.name.replace('support-', '')}:${details.requested.version ?: '+'}"
                }
            }
            // Force specific AndroidX versions known to be stable
            if (details.requested.group == 'androidx.core' && details.requested.name == 'core') {
                details.useVersion '1.15.0'
            }
            if (details.requested.group == 'androidx.media' && details.requested.name == 'media') {
                details.useVersion '1.0.0'
            }
        }
    }
}
